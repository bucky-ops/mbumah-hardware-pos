      <rect x="440" y="118" width="22" height="6" rx="3"/><rect x="440" y="142" width="22" height="6" rx="3"/>
      <rect x="440" y="166" width="22" height="6" rx="3"/><rect x="440" y="190" width="22" height="6" rx="3"/>
