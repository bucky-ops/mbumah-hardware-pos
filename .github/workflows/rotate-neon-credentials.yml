# ============================================================================
# MBUMAH HARDWARE POS — Atomic Neon credential rotation + Vercel env rollout
# ============================================================================
# SECURITY: The production Neon password was published in repo docs. This
# workflow rotates it and rolls the new connection strings out to every
# Vercel project in ONE run, with abort-before-harm ordering:
#
#   Pre-flight (no mutation):
#     1. Neon API key valid?          -> else abort
#     2. Vercel token valid?          -> else abort
#     3. Vercel env-write capability? -> else abort (probe var, then delete)
#
#   Mutation (only if all pre-flight checks passed):
#     4. Generate + mask new password, PATCH Neon role
#     5. Upsert DATABASE_URL / DIRECT_URL on every mbumah-hardware-pos* project
#     6. Redeploy each project's latest production deployment
#     7. Poll public /api/health/db until the app reports ok
#
# If step 5/6 fails after step 4, the workflow re-patches the Neon role back
# to the previous password (rollback) before exiting non-zero.
# ============================================================================

name: Rotate Neon Credentials

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROTATE to confirm production credential rotation'
        required: true
        default: ''

concurrency:
  group: rotate-neon
  cancel-in-progress: false

env:
  NEON_API: https://console.neon.tech/api/v2
  NEON_PROJECT_ID: broad-snow-78900501
  NEON_BRANCH_ID: br-proud-lab-ai15r38h
  NEON_ROLE: neondb_owner
  NEON_DB: neondb
  NEON_REGION_HOST: ep-calm-butterfly-aivj6kzm.c-4.us-east-1.aws.neon.tech
  NEON_REGION_HOST_POOLED: ep-calm-butterfly-aivj6kzm-pooler.c-4.us-east-1.aws.neon.tech

jobs:
  rotate:
    name: Rotate + Rollout (atomic)
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require confirmation
        if: github.event.inputs.confirm != 'ROTATE'
        run: |
          echo "::error::Input 'confirm' must be exactly ROTATE. Aborting."
          exit 1

      - name: Pre-flight 1 — Neon API key valid
        run: |
          CODE=$(curl -s -o /tmp/neon-user.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            "$NEON_API/users/me")
          echo "Neon /users/me -> HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::NEON_API_KEY invalid"; exit 1; }

      - name: Pre-flight 2 — Vercel token valid + resolve scope
        run: |
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          CODE=$(curl -s -o /tmp/vc-user.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" https://api.vercel.com/v2/user)
          echo "Vercel /v2/user -> HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::VERCEL_TOKEN invalid"; exit 1; }
          USER_ID=$(jq -r '.user.id' /tmp/vc-user.json)
          echo "Vercel user: $USER_ID"
          echo "VERCEL_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Pre-flight 3 — env-write capability (probe var, then clean up)
        run: |
          PROJECT="${{ secrets.VERCEL_PROJECT_ID }}"
          ORG="${{ secrets.VERCEL_ORG_ID }}"
          # Resolve teamId: VERCEL_ORG_ID may be a team id or the user id.
          TEAMQS=""
          if [[ "$ORG" == team_* ]]; then TEAMQS="?teamId=$ORG"; fi
          echo "TEAMQS=$TEAMQS" >> $GITHUB_ENV
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          CODE=$(curl -s -o /tmp/env-list.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT/env$TEAMQS")
          echo "Vercel env list -> HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::No env read access"; exit 1; }
          # Write probe: create, then delete a throwaway variable.
          CODE=$(curl -s -o /tmp/probe.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v10/projects/$PROJECT/env?upsert=true$TEAMQS" \
            -d '[{"key":"CI_ENV_WRITE_PROBE","value":"ok","type":"encrypted","target":["production"]}]')
          echo "Env write probe -> HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::No env WRITE access — rotation would strand production. Aborting."; exit 1; }
          curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT/env/CI_ENV_WRITE_PROBE$TEAMQS"
          echo "Probe var deleted."

      - name: Rotate Neon password (first mutation)
        run: |
          NEW_PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 28)
          echo "::add-mask::$NEW_PW"
          echo "NEW_PW=$NEW_PW" >> $GITHUB_ENV
          OLD_PW="npg_aRfWJIn8Neq9" # leaked credential (inert after this run)
          echo "::add-mask::$OLD_PW"
          echo "OLD_PW=$OLD_PW" >> $GITHUB_ENV
          CODE=$(curl -s -o /tmp/rotate.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -H "Content-Type: application/json" \
            "$NEON_API/projects/$NEON_PROJECT_ID/branches/$NEON_BRANCH_ID/roles/$NEON_ROLE" \
            -d "{\"password\":{\"password\":\"$NEW_PW\"}}")
          echo "Neon role PATCH -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            cat /tmp/rotate.json; echo "::error::Neon rotation failed BEFORE any Vercel change — safe abort."
            exit 1
          fi
          echo "DATABASE_URL=postgresql://$NEON_ROLE:$NEW_PW@$NEON_REGION_HOST_POOLED/$NEON_DB?sslmode=require&pgbouncer=true&connect_timeout=15" >> $GITHUB_ENV
          echo "DIRECT_URL=postgresql://$NEON_ROLE:$NEW_PW@$NEON_REGION_HOST/$NEON_DB?sslmode=require&connect_timeout=30" >> $GITHUB_ENV

      - name: Roll out env vars to every mbumah-hardware-pos* project
        run: |
          set -e
          PAGE=1; PROJECT_IDS=""
          while :; do
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects?limit=100&projectId=$PROJECT$TEAMQS&page=$PAGE")
            NAMES=$(echo "$RESP" | jq -r '.projects[]? | "\(.id) \(.name)"')
            MATCHED=$(echo "$NAMES" | grep -E "^\\S+ mbumah-hardware-pos" || true)
            [ -n "$MATCHED" ] && PROJECT_IDS="$PROJECT_IDS
          $MATCHED"
            HAS_NEXT=$(echo "$RESP" | jq -r 'if .pagination.hasNext then 1 else 0 end')
            [ "$HAS_NEXT" = "1" ] || break
            PAGE=$((PAGE+1))
          done
          echo "Matched projects:"; echo "$PROJECT_IDS"
          [ -n "$(echo "$PROJECT_IDS" | tr -d '[:space:]')" ] || { echo "::error::No matching projects"; exit 1; }
          echo "PROJECT_IDS<<PROJECT_IDS_EOF" >> $GITHUB_ENV
          echo "$PROJECT_IDS" >> $GITHUB_ENV
          echo "PROJECT_IDS_EOF" >> $GITHUB_ENV
          echo "Project ids: $(echo "$PROJECT_IDS" | awk '{print $1}' | tr '\n' ' ')"
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            PID=$(echo "$LINE" | awk '{print $1}')
            PNAME=$(echo "$LINE" | awk '{print $2}')
            for KEY in DATABASE_URL DIRECT_URL; do
              VAL=$(printenv $KEY)
              CODE=$(curl -s -o /tmp/upsert.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
                "https://api.vercel.com/v10/projects/$PID/env?upsert=true$TEAMQS" \
                -d "[{\"key\":\"$KEY\",\"value\":\"$VAL\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\",\"development\"]}]")
              echo "$PNAME :: $KEY -> HTTP $CODE"
              if [ "$CODE" != "200" ]; then cat /tmp/upsert.json; echo "::error::Env rollout failed"; exit 1; fi
            done
          done <<< "$PROJECT_IDS"

      - name: Redeploy production for each project
        run: |
          set -e
          for PID in $(echo "$PROJECT_IDS" | awk '{print $1}' | grep .); do
            URL=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$PID&target=production&state=READY&limit=1$TEAMQS" \
              | jq -r '.deployments[0].url // empty')
            if [ -n "$URL" ]; then
              echo "Redeploying $PID from $URL"
              npx -y vercel@latest redeploy "$URL" --yes --token="$VERCEL_TOKEN" || \
                echo "::warning::Redeploy of $PID failed — env vars are set; trigger a manual redeploy."
            else
              echo "::warning::No READY production deployment found for $PID"
            fi
          done

      - name: Rollback Neon password if rollout failed
        if: failure()
        run: |
          if [ -n "$OLD_PW" ] && [ -n "$NEW_PW" ]; then
            echo "::warning::Rolling back Neon password to previous value..."
            curl -s -X PATCH \
              -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
              -H "Content-Type: application/json" \
              "$NEON_API/projects/$NEON_PROJECT_ID/branches/$NEON_BRANCH_ID/roles/$NEON_ROLE" \
              -d "{\"password\":{\"password\":\"$OLD_PW\"}}" | head -c 200
          fi

      - name: Health check — app must be healthy on new credentials
        run: |
          for i in $(seq 1 20); do
            sleep 15
            RESP=$(curl -s -m 20 https://mbumah-hardware-pos-one.vercel.app/api/health/db || true)
            STATUS=$(echo "$RESP" | jq -r '.status // empty' 2>/dev/null || true)
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "ok" ]; then
              echo "✅ App healthy on rotated credentials."
              echo "$RESP" | jq '{status, responseTime, detail}'
              exit 0
            fi
          done
          echo "::error::App did not report healthy after rotation — check Vercel deployment logs."
          exit 1

      - name: Summary
        run: |
          echo "## 🔐 Neon credential rotation" >> $GITHUB_STEP_SUMMARY
          echo "- Password rotated for role \`$NEON_ROLE\` on branch \`$NEON_BRANCH_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`DATABASE_URL\` + \`DIRECT_URL\` upserted on all mbumah-hardware-pos* Vercel projects" >> $GITHUB_STEP_SUMMARY
          echo "- Production redeploys triggered; health check passed" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Remove any remaining references to the old password from repo docs/git history" >> $GITHUB_STEP_SUMMARY
