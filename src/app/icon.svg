<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mbumah Hardware mark">
  <defs>
    <linearGradient id="navy3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a4a"/>
      <stop offset="0.55" stop-color="#12243D"/>
      <stop offset="1" stop-color="#0F1E33"/>
    </linearGradient>
    <linearGradient id="orange3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA040"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="steel3d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8ECF2"/>
      <stop offset="0.5" stop-color="#C0C7D1"/>
      <stop offset="1" stop-color="#9AA3B2"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="#12243D"/>

  <!-- gear teeth -->
  <g fill="url(#orange3d)">
    <rect x="245" y="40" width="22" height="22" rx="5"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(30 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(60 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(90 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(120 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(150 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(180 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(210 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(240 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(270 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(300 256 256)"/>
    <rect x="245" y="40" width="22" height="22" rx="5" transform="rotate(330 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="150" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#steel3d)" stroke-width="10"/>

  <!-- orange house -->
  <polygon points="256,150 166,226 346,226" fill="url(#orange3d)"/>
  <rect x="186" y="226" width="140" height="112" rx="8" fill="url(#orange3d)"/>
  <rect x="232" y="258" width="48" height="80" rx="6" fill="#FFFFFF"/>
  <rect x="200" y="242" width="30" height="26" rx="4" fill="#12243D" opacity="0.9"/>
  <rect x="282" y="242" width="30" height="26" rx="4" fill="#12243D" opacity="0.9"/>

  <!-- trowel -->
  <g transform="rotate(-30 150 400)">
    <rect x="96" y="382" width="72" height="52" rx="12" fill="url(#steel3d)" stroke="#8A93A3" stroke-width="3"/>
    <rect x="168" y="399" width="44" height="16" rx="8" fill="url(#orange3d)"/>
    <rect x="212" y="396" width="16" height="22" rx="5" fill="#FFFFFF"/>
  </g>
</svg>
