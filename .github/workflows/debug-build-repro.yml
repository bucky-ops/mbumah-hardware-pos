name: Debug — reproduce vercel-build with real DATABASE_URL
# DIAGNOSTIC ONLY — dispatched manually from the debug/build-repro branch.
# Reads the production DATABASE_URL/DIRECT_URL from the Vercel project env
# (the same way rotate-neon-credentials manages it) and runs the EXACT
# vercel-build chain (setup-prisma-provider → prisma generate →
# sync-db-schema → next build) on a GitHub runner so the failing step and
# its logs are visible. Falls back to an isolated Neon branch (data copy)
# if env decryption is not permitted. Secrets are masked; hosts are printed
# without credentials.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      NEON_API: https://console.neon.tech/api/v2
      NEON_PROJECT_ID: broad-snow-78900501
      NEON_BRANCH_ID: br-proud-lab-ai15r38h
      NEON_ROLE: neondb_owner
      NEON_DB: neondb
      NEON_REGION_HOST: ep-calm-butterfly-aivj6kzm.c-4.us-east-1.aws.neon.tech
      NEON_REGION_HOST_POOLED: ep-calm-butterfly-aivj6kzm-pooler.c-4.us-east-1.aws.neon.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve source of DATABASE_URL (Vercel env decrypt → Neon branch fallback)
        id: uri
        run: |
          set -e
          PROJECT="${{ secrets.VERCEL_PROJECT_ID }}"
          ORG="${{ secrets.VERCEL_ORG_ID }}"
          TEAMQS=""
          if [[ "$ORG" == team_* ]]; then TEAMQS="teamId=$ORG&"; fi
          get_env () { # $1=key
            RESP=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              "https://api.vercel.com/v9/projects/$PROJECT/env?${TEAMQS}decrypt=true")
            VAL=$(echo "$RESP" | jq -r ".envs[]? | select(.key==\"$1\") | .value" | head -1)
            if [ -z "$VAL" ] || [ "$VAL" = "null" ]; then
              ID=$(echo "$RESP" | jq -r ".envs[]? | select(.key==\"$1\") | .id" | head -1)
              if [ -n "$ID" ] && [ "$ID" != "null" ]; then
                VAL=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                  "https://api.vercel.com/v9/projects/$PROJECT/env/$ID?${TEAMQS}decrypt=true" | jq -r '.value // empty')
              fi
            fi
            echo "$VAL"
          }
          DB=$(get_env DATABASE_URL)
          DU=$(get_env DIRECT_URL)
          SOURCE="vercel-env"
          if [ -z "$DB" ]; then
            echo "::warning::Vercel env decrypt unavailable — creating an isolated Neon branch (data copy) instead."
            SOURCE="neon-branch"
            BR=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" -H "Content-Type: application/json" \
              "$NEON_API/projects/$NEON_PROJECT_ID/branches" \
              -d "{\"branch\":{\"parent_id\":\"$NEON_BRANCH_ID\",\"name\":\"debug-build-repro\"}}")
            NEW_BRANCH=$(echo "$BR" | jq -r '.branch.id // empty')
            NEW_HOST=$(echo "$BR" | jq -r '.branch.connection_uris.unpooled_connection_uri // empty' | sed -E 's|.*@([^/?]+).*|\1|')
            [ -z "$NEW_HOST" ] && NEW_HOST=$(echo "$BR" | jq -r '.endpoints[]? | select(.host | contains("pooler") | not) | .host' | head -1)
            PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 28)
            curl -s -X PATCH -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" -H "Content-Type: application/json" \
              "$NEON_API/projects/$NEON_PROJECT_ID/branches/$NEW_BRANCH/roles/$NEON_ROLE" \
              -d "{\"password\":{\"password\":\"$PW\"}}" > /dev/null
            DB="postgresql://$NEON_ROLE:$PW@$NEW_HOST/$NEON_DB?sslmode=require&connect_timeout=30"
            DU="$DB"
            echo "branch=$NEW_BRANCH host=$NEW_HOST"
          else
            echo "::add-mask::$DB"
            [ -n "$DU" ] && echo "::add-mask::$DU"
            echo "resolved from Vercel env (values masked)"
          fi
          echo "SOURCE=$SOURCE"
          echo "::add-mask::$DB"
          [ -n "$DU" ] && echo "::add-mask::$DU"
          echo "DATABASE_URL=$DB" >> $GITHUB_ENV
          echo "DIRECT_URL=$DU" >> $GITHUB_ENV

      - name: Install dependencies (postinstall = provider detect + prisma generate)
        run: bun install --frozen-lockfile

      - name: sync-db-schema.mjs (migrate deploy / db push path) — VERBOSE
        run: |
          echo "DB host: $(echo "$DATABASE_URL" | sed -E 's|.*@([^/?]+).*|\1|')"
          node scripts/setup-prisma-provider.mjs
          node scripts/sync-db-schema.mjs
          echo "SYNC_EXIT=$?"

      - name: next build — VERBOSE
        run: |
          SKIP_ENV_VALIDATION=1 node scripts/setup-prisma-provider.mjs
          SKIP_ENV_VALIDATION=1 bunx prisma generate
          SKIP_ENV_VALIDATION=1 bun run build 2>&1 | tail -120
