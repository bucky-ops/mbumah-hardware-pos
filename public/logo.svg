<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mbumah Hardware">
  <defs>
    <linearGradient id="navy3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a4a"/>
      <stop offset="0.55" stop-color="#12243D"/>
      <stop offset="1" stop-color="#0F1E33"/>
    </linearGradient>
    <linearGradient id="orange3d" x1="0" y1="0" x2="0" y2="1">
